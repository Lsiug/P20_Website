<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — P20 Ambassadors</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">P20 Ambassadors</div>
    <h2>Welcome back</h2>
    <p class="login-sub">Log in to access the ambassador portal.</p>

    <div class="login-error" id="login-error">Incorrect username or password.</div>

    <form id="login-form">
      <div class="form-group" style="text-align:left;">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
      </div>
      <div class="form-group" style="text-align:left;">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" style="width:100%; margin-top:0.5rem;">Log In</button>
    </form>

    <div class="login-hint">
      <strong>Demo Credentials</strong>
      Ambassador &mdash; user: <code>ambassador</code> &nbsp; pw: <code>p20amb</code><br />
      Staff &mdash; user: <code>staff</code> &nbsp; pw: <code>p20staff</code>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Already logged in → go straight to home
    if (p20GetUser()) window.location.href = 'index.html';

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      if (p20Login(username, password)) {
        window.location.href = 'index.html';
      } else {
        const err = document.getElementById('login-error');
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
