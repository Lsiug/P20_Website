<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Educational Ambassadors</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <a href="login.html" class="p20-logo"><img src="images/p20logo.webp" alt="P20 Logo" /></a>

  <h1 class="login-page-title">Educational Ambassadors</h1>
  <p class="login-welcome">Welcome back</p>

  <div class="login-card" style="position:relative; z-index:1;">

    <!-- Left: credentials -->
    <div class="login-col-left">
      <div class="login-error" id="login-error">Incorrect username or password.</div>
      <form id="login-form" class="login-form-row">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary login-submit">Log In</button>
      </form>
    </div>

    <!-- Vertical divider -->
    <div class="login-vdivider"></div>

    <!-- Right: Google -->
    <div class="login-col-right">
      <p class="login-or">Or sign in with</p>
      <button class="btn-google" onclick="alert('Google sign-in is not enabled in this demo.')">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google" />
        Sign in with Google
      </button>
    </div>

  </div>

  <div class="login-below-card">
    <a href="#" class="login-forgot">Forgot password?</a>
    <p class="login-portal-hint">Accepted ambassador? <a href="portal.html">Register with your access code &rarr;</a></p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    (async function() {
      const res = await fetch('/api/auth/me').catch(() => null);
      if (res && res.ok) {
        const user = await res.json();
        if (user.role === 'staff') window.location.href = 'admin.html';
        else if (!user.onboarding_complete) window.location.href = 'onboarding.html';
        else window.location.href = 'index.html';
      }
    })();

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const btn = this.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const user = await p20Login(username, password);
        if (user.role === 'staff') {
          window.location.href = 'admin.html';
        } else if (!user.onboarding_complete) {
          window.location.href = 'onboarding.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        const errEl = document.getElementById('login-error');
        errEl.textContent = err.message || 'Incorrect username or password.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
